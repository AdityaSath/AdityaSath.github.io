# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build and validate portfolio
        run: |
          python3 scripts/build.py
          python3 scripts/check-static.py
      - name: Prepare public site
        run: |
          mkdir -p _site/css _site/javascript
          cp index.html _site/
          cp -R html images media _site/
          cp css/site.css _site/css/
          cp css/plume.css _site/css/
          cp javascript/site.js _site/javascript/
          cp javascript/hero-video.js _site/javascript/
          cp Aditya_Sathishkumar_Master_Resume.pdf _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the site; keep content archives and tooling in the repository.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
